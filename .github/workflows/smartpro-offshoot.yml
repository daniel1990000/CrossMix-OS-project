name: Smart Pro offshoot host checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project/**', '.github/workflows/smartpro-offshoot.yml']
  pull_request:
    paths: ['project/**', '.github/workflows/smartpro-offshoot.yml']
permissions:
  contents: read
concurrency:
  group: smartpro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project/
            /docs/spruce-source-lock.json
            /.github/workflows/smartpro-offshoot.yml
            /.gitattributes
            /AGENTS.md
            /HANDOVER.md
            /TRIMUI_PLAN.md
            /README.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spruceUI/spruceOS
          ref: d45ff8dfe5756147522b04ae5863d17a90e88b54
          path: upstream-reference
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            App/PyUI/main-ui/**/*.py
            App/PyUI/main-ui/LICENSE.md
            App/PyUI/LICENSE.md
            App/PyUI/launch.sh
            App/PyUI/py-ui-config.json
            App/-OTA/downloader.sh
            App/USBStorageMode/launch.sh
            RetroArch/igm/README.md
            RetroArch/igm/spruce.json
            spruce/scripts/
            LICENSE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hrydgard/ppsspp
          ref: d357e6a32934800d3d80b49f910a603e1b069751
          path: ppsspp-reference
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Core/
            Common/
            SDL/
            UI/
            LICENSE.TXT
            assets/themes
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spruceUI/RA
          ref: 71d84da4dc88945177a3eb34268013355c705dbd
          path: spruce-ra-reference
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            patches/common/0001-spruce-igm.patch
            common_src/spruce_igm_theme.c
            common_src/spruce_igm_theme.h
            build.sh
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libsodium23 binutils
      - run: python -m pip install -r project/requirements-dev.txt
      - run: sh project/dev/check.sh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SPRUCE_SOURCE_ROOT: ${{ github.workspace }}/upstream-reference
          PPSSPP_SOURCE_ROOT: ${{ github.workspace }}/ppsspp-reference
          SPRUCE_RA_SOURCE_ROOT: ${{ github.workspace }}/spruce-ra-reference
      - run: python project/packaging/dev_release.py --output dist/development --include-source --smoke-python "$(command -v python)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-preview-evidence
          path: dist/
