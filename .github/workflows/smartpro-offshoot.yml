name: Smart Pro offshoot host checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project/**', '.github/workflows/smartpro-offshoot.yml']
  pull_request:
    paths: ['project/**', '.github/workflows/smartpro-offshoot.yml']
permissions:
  contents: read
concurrency:
  group: smartpro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project/
            /docs/spruce-source-lock.json
            /.github/workflows/smartpro-offshoot.yml
            /.gitattributes
            /AGENTS.md
            /HANDOVER.md
            /TRIMUI_PLAN.md
            /README.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spruceUI/spruceOS
          ref: d45ff8dfe5756147522b04ae5863d17a90e88b54
          path: upstream-reference
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            App/PyUI/main-ui/devices/miyoo_trim_common.py
            App/-OTA/downloader.sh
            App/USBStorageMode/launch.sh
            spruce/scripts/helperFunctions.sh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hrydgard/ppsspp
          ref: d357e6a32934800d3d80b49f910a603e1b069751
          path: ppsspp-reference
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Core/Config.cpp
            Core/Config.h
            Core/ConfigSettings.h
            Core/ConfigSettings.cpp
            Core/ConfigValues.h
            Core/KeyMap.cpp
            Core/KeyMap.h
            Core/System.h
            Core/HLE/sceCtrl.h
            Core/HLE/sceUtility.h
            Common/Input/InputState.h
            Common/Input/KeyCodes.h
            Common/UI/PopupScreens.h
            Common/Data/Text/I18n.h
            Common/Data/Format/IniFile.cpp
            Common/Data/Text/Parsers.cpp
            Common/StringUtils.cpp
            SDL/SDLJoystick.cpp
            UI/GameSettingsScreen.cpp
            UI/NativeApp.cpp
            UI/Theme.cpp
            LICENSE.TXT
            assets/themes
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libsodium23
      - run: python -m pip install -r project/requirements-dev.txt
      - run: sh project/dev/check.sh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SPRUCE_SOURCE_ROOT: ${{ github.workspace }}/upstream-reference
          PPSSPP_SOURCE_ROOT: ${{ github.workspace }}/ppsspp-reference
      - run: python project/packaging/dev_release.py --output dist/development --include-source --smoke-python "$(command -v python)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-preview-evidence
          path: dist/
