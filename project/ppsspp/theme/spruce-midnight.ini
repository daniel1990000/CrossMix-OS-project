# SPDX-License-Identifier: MIT
# Original palette for the Smart Pro spruce offshoot, 2026.
# Uses PPSSPP's supported theme data schema; no Sony assets or fonts.
# Color strings use PPSSPP's #RRGGBBAA notation, not packed ABGR integers.

[Spruce Midnight]
Name = "Spruce Midnight"
ItemStyleFg = "#EBF4F4FF"
ItemStyleBg = "#102638AA"
ItemFocusedStyleFg = "#081522FF"
ItemFocusedStyleBg = "#64FFDFFF"
ItemDownStyleFg = "#081522FF"
ItemDownStyleBg = "#3ECBB4FF"
ItemDisabledStyleFg = "#8EA3ABFF"
ItemDisabledStyleBg = "#0B172699"
HeaderStyleFg = "#EBF4F4FF"
HeaderStyleBg = "#00000000"
InfoStyleFg = "#B2CBD0FF"
InfoStyleBg = "#00000000"
PopupStyleFg = "#EBF4F4FF"
PopupStyleBg = "#102638FF"
PopupTitleStyleFg = "#64FFDFFF"
PopupTitleStyleBg = "#00000000"
TooltipStyleFg = "#EBF4F4FF"
TooltipStyleBg = "#102638F2"
CollapsibleHeaderStyleFg = "#EBF4F4FF"
CollapsibleHeaderStyleBg = "#102638BB"
BackgroundColor = "#081522FF"
ScrollbarColor = "#64DFCAAA"
PopupSliderColor = "#B2CBD0FF"
PopupSliderFocusedColor = "#64FFDFFF"

[Spruce Midnight High Contrast]
