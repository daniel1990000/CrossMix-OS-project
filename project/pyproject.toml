[build-system]
requires = ["setuptools>=69,<76", "wheel>=0.43,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpro-psp-experience"
dynamic = ["version"]
description = "PSP-style TrimUI interface using adapted RetroPass source and pinned spruce integrations"
requires-python = ">=3.9"
dependencies = ["PySDL2==0.9.17"]

[project.optional-dependencies]
preview = ["Pillow==11.1.0"]

[project.scripts]
smartpro-preview = "psp_shell.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["psp_shell*", "retropass*"]

[tool.setuptools.package-data]
retropass = ["NOTICE.txt", "LICENSE.txt", "source-lock.json"]

[tool.setuptools.dynamic]
version = {attr = "psp_shell.__version__"}

[tool.setuptools.data-files]
"share/psp_shell/assets/fonts" = ["assets/fonts/NotoSans.ttf", "assets/fonts/OFL.txt"]
"share/psp_shell/metadata" = ["packaging/current-release.json"]

"share/psp_shell/source/vendor/retropass" = [
  "vendor/retropass/.gitattributes",
  "vendor/retropass/.gitignore",
  "vendor/retropass/AUTHORS.md",
  "vendor/retropass/LICENSE.txt",
  "vendor/retropass/README.md",
  "vendor/retropass/RetroPass.sln",
]

"share/psp_shell/source/vendor/retropass/.github/workflows" = [
  "vendor/retropass/.github/workflows/main.yml",
]

